<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background: #f7f5f1;
}

.hero {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;

    background:
        radial-gradient(
            circle at 50% 50%,
            #ffffff 0%,
            #f7f5f1 65%,
            #efede8 100%
        );
}


/* =========================================================
   COLORFUL BACKGROUND SHAPES
   ========================================================= */

.color-shape {
    position: absolute;
    border-radius: 50%;
    filter: blur(3px);
    opacity: 0.32;
    z-index: 1;
    pointer-events: none;
}

.shape1 {
    width: 280px;
    height: 150px;
    background: #ff6fae;
    left: 8%;
    top: 25%;
    transform: rotate(-18deg);
}

.shape2 {
    width: 260px;
    height: 140px;
    background: #7c6cff;
    right: 10%;
    top: 20%;
    transform: rotate(22deg);
}

.shape3 {
    width: 300px;
    height: 150px;
    background: #00d9c0;
    left: 35%;
    bottom: 10%;
    transform: rotate(-12deg);
}

.shape4 {
    width: 220px;
    height: 120px;
    background: #ffd83d;
    right: 25%;
    bottom: 22%;
    transform: rotate(25deg);
}

.shape5 {
    width: 200px;
    height: 100px;
    background: #ff8552;
    left: 25%;
    top: 12%;
    transform: rotate(15deg);
}


/* =========================================================
   DOODLE LAYER
   ========================================================= */

.doodles {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    z-index: 2;

    pointer-events: none;
}


/* =========================================================
   DOODLES
   ========================================================= */

.doodle {
    position: absolute;

    width: var(--size);
    height: var(--size);

    object-fit: contain;

    opacity: 0.48;

    filter:
        grayscale(1)
        contrast(1.35);

    animation:
        float var(--speed) ease-in-out infinite;

    animation-delay: var(--delay);

    pointer-events: none;

    user-select: none;
}


/* =========================================================
   ANIMATION
   ========================================================= */

@keyframes float {

    0% {
        transform:
            translate(0, 0)
            rotate(var(--rotation));
    }

    25% {
        transform:
            translate(
                var(--move-x, 8px),
                var(--move-y, -10px)
            )
            rotate(
                calc(var(--rotation) + 5deg)
            );
    }

    50% {
        transform:
            translate(
                calc(var(--move-x, 8px) * -1),
                var(--move-y, -18px)
            )
            rotate(
                calc(var(--rotation) - 6deg)
            );
    }

    75% {
        transform:
            translate(
                var(--move-x, 6px),
                var(--move-y, -8px)
            )
            rotate(
                calc(var(--rotation) + 3deg)
            );
    }

    100% {
        transform:
            translate(0, 0)
            rotate(var(--rotation));
    }
}


/* =========================================================
   CENTER CONTENT
   ========================================================= */

.content {
    position: absolute;

    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    width: 92%;

    text-align: center;

    z-index: 10;

    pointer-events: none;
}


/* =========================================================
   TITLE
   ========================================================= */

.title {

    font-family:
        Impact,
        Haettenschweiler,
        "Arial Black",
        Arial,
        sans-serif;

    font-size:
        clamp(55px, 9vw, 145px);

    font-weight: 900;

    line-height: 0.9;

    letter-spacing: -5px;

    color: #050505;

    text-transform: uppercase;

    text-shadow:
        2px 2px 0 rgba(255,255,255,0.5);

    white-space: nowrap;
}


/* =========================================================
   SUBTITLE
   ========================================================= */

.subtitle {

    margin-top: 18px;

    font-size: 14px;

    letter-spacing: 5px;

    font-weight: 700;

    color: #111;

    text-transform: uppercase;
}


/* =========================================================
   FOOTER
   ========================================================= */

.footer {

    position: absolute;

    left: 35px;
    right: 35px;
    bottom: 28px;

    z-index: 20;

    display: flex;

    justify-content: space-between;

    align-items: center;

    font-size: 14px;

    font-weight: 700;

    letter-spacing: 1px;

    color: #111;
}


/* =========================================================
   LOCATION
   ========================================================= */

.location {

    display: flex;

    align-items: center;

    gap: 7px;
}


/* =========================================================
   PIN
   ========================================================= */

.pin {

    width: 14px;
    height: 18px;

    border: 2px solid #111;

    border-radius:
        50% 50% 50% 0;

    transform: rotate(-45deg);

    position: relative;
}

.pin::after {

    content: "";

    position: absolute;

    width: 4px;
    height: 4px;

    background: #111;

    border-radius: 50%;

    top: 5px;
    left: 3px;
}


/* =========================================================
   AUTHOR
   ========================================================= */

.author {
    font-weight: 700;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 700px) {

    .title {

        font-size: 16vw;

        letter-spacing: -3px;

        white-space: normal;
    }

    .subtitle {

        font-size: 9px;

        letter-spacing: 3px;
    }

    .footer {

        left: 18px;
        right: 18px;
        bottom: 18px;

        font-size: 12px;
    }

    .doodle {
        opacity: 0.40;
    }
}


/* =========================================================
   REDUCED MOTION
   ========================================================= */

@media (prefers-reduced-motion: reduce) {

    .doodle {
        animation: none;
    }
}

</style>
</head>
